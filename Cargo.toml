[package]
name = "squish"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Batch video re-encoder on top of ffmpeg with NVENC constant-quality defaults"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MkSavin/squish"
keywords = ["ffmpeg", "nvenc", "video", "transcode", "cli"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.5.2"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
trash = "5.2.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
